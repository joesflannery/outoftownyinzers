{% extends "base.html" %}
{% block title %}{{ form_title }} -- Out of Town Yinzers{% endblock %}
{% block content %}
<h1>{{ form_title }}</h1>
<form class="stacked" method="post">
    <label for="title">Title</label>
    <input type="text" id="title" name="title" value="{{ post['title'] if post else '' }}" required>

    <label for="author">Author</label>
    <input type="text" id="author" name="author" value="{{ post['author'] if post else '' }}" required>

    <label for="body">Body</label>
    <textarea id="body" name="body" required>{{ post['body'] if post else '' }}</textarea>

    <div style="margin-top: 1.5rem; display: flex; gap: 0.75rem;">
        <button class="btn" type="submit">Save</button>
        <a class="btn secondary" href="{{ url_for('blog.index') }}">Cancel</a>
    </div>
</form>
{% endblock %}
